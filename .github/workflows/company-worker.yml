name: Company worker
on:
  workflow_dispatch:
    inputs:
      role:
        type: choice
        description: Function to prepare a proposal
        required: true
        options: [product, engineering, design, marketing, operations]
      task:
        type: string
        description: One bounded task and its expected outcome
        required: true
      send_to_xai:
        type: boolean
        description: Send approved company context to xAI (runtime policy must also be enabled)
        default: false
permissions:
  contents: read
concurrency:
  group: company-worker-${{ inputs.role }}
  cancel-in-progress: false
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Prepare brief or request a proposal
        env:
          COMPANY_ROLE: ${{ inputs.role }}
          COMPANY_TASK: ${{ inputs.task }}
          COMPANY_SEND: ${{ inputs.send_to_xai }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
        run: |
          mkdir -p .company/runs
          if [ "$COMPANY_SEND" = "true" ]; then
            python -S scripts/company.py propose --role "$COMPANY_ROLE" --task "$COMPANY_TASK" --send
          else
            python -S scripts/company.py brief --role "$COMPANY_ROLE" --task "$COMPANY_TASK" > .company/runs/offline-brief.json
          fi
      - name: Upload review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: company-worker-${{ inputs.role }}-${{ github.run_id }}
          path: .company/runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
